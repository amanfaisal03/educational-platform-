services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres

    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_password
      POSTGRES_DB: platformdb

    ports:
      - "5433:5432"

    volumes:
      - educational_platform_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platformdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env
    environment:
      database_url: postgresql+psycopg2://platform_user:platform_password@postgres:5432/platformdb
      SECURE_COOKIES: "false"
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    container_name: frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  educational_platform_postgres_data:
