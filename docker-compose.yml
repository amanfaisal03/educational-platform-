services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: educational-platform-postgres
    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_password
      POSTGRES_DB: platformdb
    ports:
      - "5433:5432"
    volumes:
      - educational_platform_postgres_data:/var/lib/postgresql
    networks:
      - platform-network

volumes:
  educational_platform_postgres_data:

networks:
  platform-network: