<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<nav class="topbar">
    <a class="brand" href="/api/v1/admin">LearnSpace Admin</a>
    <div class="nav-links">
        <a href="/api/v1/admin/courses">Courses</a>
        <a href="/api/v1/auth/signout">Sign out</a>
    </div>
</nav>
<main>
<div class="hero">
    <div>
        <span class="eyebrow">Administration</span>
        <h1>Admin dashboard</h1>
        <p>Manage students and keep course content up to date.</p>
    </div>
</div>
<div  class="card">
   <h2>Students in 10th grade </h2>

{% for student in students %}
    <p>{{ student.id }} - {{ student.name }}</p>
{% endfor %}

</div>

<!--    <button type="submit">Add Student</button>-->
<!--</form>-->

<form action="/api/v1/admin/students/delete" method="post" class = "card">
    <input type="number" name="student_id" placeholder="Student ID" required>
    <button type="submit">Delete Student</button>
</form>

<h2>Courses</h2>

<div  class="card">
     <a href="/api/v1/admin/courses">Courses</a>
</div>

</main>
</body>
</html>
