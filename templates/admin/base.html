<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}الإدارة{% endblock %} | درب</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/admin-dashboard.css">
</head>
<body class="admin-dashboard">
    <aside class="admin-sidebar">
        <a class="admin-brand" href="/api/v1/admin/courses"><span aria-hidden="true">✦</span> درب</a>
        <nav aria-label="التنقل الرئيسي">
            <a href="/api/v1/admin/courses" {% if active_page == 'courses' %}aria-current="page"{% endif %}><span aria-hidden="true">▤</span> كورساتي</a>
            <a href="/api/v1/admin" {% if active_page == 'students' %}aria-current="page"{% endif %}><span aria-hidden="true">♙</span> الطلاب</a>
        </nav>
        <div class="admin-account"><strong>مساحة الإدارة</strong><a href="/api/v1/auth/signout">تسجيل الخروج ←</a></div>
    </aside>
    <main class="admin-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
