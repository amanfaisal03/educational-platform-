<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lessons</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main>
    <h1>{{ unit.title }}</h1>

    <div class="card">
        <form action="/api/v1/admin/lessons" method="post">

            <input type="hidden" name="unit_id" value="{{ unit.id }}">

            <input type="text" name="title" placeholder="Lesson title" required>

            <button type="submit">Add Lesson</button>

        </form>
    </div>

    {% for lesson in unit.lessons %}

    <div class="card">

        <h3>{{ lesson.title }}</h3>

        <form action="/api/v1/admin/lessons/upload-pdf" method="post" enctype="multipart/form-data">

            <input type="hidden" name="lesson_id" value="{{ lesson.id }}">

            <input type="file" name="file" accept=".pdf" required>

            <button type="submit">Upload PDF</button>

        </form>

        <br>

        <form action="/api/v1/admin/lessons/upload-video" method="post" enctype="multipart/form-data">

            <input type="hidden" name="lesson_id" value="{{ lesson.id }}">

            <input type="file" name="file" accept="video/*" required>

            <button type="submit">Upload Video</button>

        </form>

    </div>

    {% endfor %}
</main>
</body>
</html>
