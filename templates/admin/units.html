<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Units</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261006-pagination-2">
</head>
<body>
<nav class="topbar">
    <a class="brand" href="/api/v1/admin">LearnSpace Admin</a>
    <div class="nav-links">
        <a href="/api/v1/admin/courses">Courses</a>
        <a href="/api/v1/auth/signout">Sign out</a>
    </div>
</nav>
<main>
<span class="eyebrow">Course content</span>
<h1>Units for {{ course.name }}</h1>
<h3> you can add unit  </h3>
<form action="/api/v1/admin/units" method="post" class="card">

    <input type="hidden" name="course_id" value="{{ course.id }}">
    <input type="text" name="title" placeholder="Unit title" required>
    <button type="submit">Add Unit</button>
</form>


<h2>Existing Units</h2>

{% for unit in units %}
<div  class="card">
    <h3>{{ unit.title }}</h3>

    <a href="/api/v1/admin/units/{{ unit.id }}/lessons">Lessons for this unit</a>
</div>
{% endfor %}

{% include "partials/pagination.html" %}

<div class="card">
 <a href="/api/v1/admin/courses">BACK TO COURSE</a>
</div>

<div class="card">
    <a href="/api/v1/auth/signout" > SIGN OUT</a>
</div>
</main>
</body>
</html>
