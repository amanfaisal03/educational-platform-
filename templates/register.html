<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إنشاء حساب | درب</title>
    <link rel="stylesheet" href="/static/login.css">
    <link rel="stylesheet" href="/static/register.css">
</head>
<body class="registration-page">
<main class="login-layout">
    <section class="login-panel" aria-labelledby="register-title">
        <div class="login-content">
            <a class="brand" href="/api/v1/auth/sign_in" aria-label="درب - تسجيل الدخول">
                <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="M6 11v6c4 3 8 3 12 0v-6"/></svg></span>
                <span>درب</span>
            </a>
            <h1 id="register-title">أنشئ حسابك</h1>
            <p class="intro">دقيقة وحدة وبتكون جاهز تبدأ.</p>
            <form id="registration-form" method="post" action="/api/v1/auth/register">
                <div class="field">
                    <label for="name">الاسم الكامل</label>
                    <input id="name" name="name" type="text" placeholder="الاسم الثلاثي" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="email">البريد الإلكتروني</label>
                    <input id="email" name="email" type="email" placeholder="name@email.com" autocomplete="email" dir="ltr" required>
                </div>
                <div class="field">
                    <label for="password">كلمة المرور</label>
                    <input id="password" name="password" type="password" placeholder="٨ أحرف على الأقل" autocomplete="new-password" dir="ltr" minlength="8" required>
                </div>
                <button class="submit-button" id="register-submit" type="submit">إنشاء الحساب</button>
            </form>
            <div class="account-links"><p>عندك حساب؟ <a href="/api/v1/auth/sign_in">سجّل دخولك</a></p></div>
        </div>
    </section>
    <aside class="benefits-panel" aria-labelledby="benefits-title">
        <div class="benefits-content">
            <h2 id="benefits-title">كل دروس صفّك بمكان واحد</h2>
            <p id="benefits-description">فيديوهات وملفات <bdi>PDF</bdi> مرتّبة حسب الوحدات والدروس، وبتتابع تقدمك خطوة بخطوة.</p>
        </div>
    </aside>
</main>
</body>
</html>
