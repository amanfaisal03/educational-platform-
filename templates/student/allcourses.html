<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">

</head>
<body>

    <div class="start">
        <h2>Student Dashboard</h2>
        <a href="/api/v1/student/mycourses">My courses</a>
        <a href="/api/v1/auth/signout">Sign Out</a>
    </div>

    <div>

        <h1>Courses</h1>

        <div class="courses">

            {% for course in courses %}

            <div class="card">

                <h3>{{ course.name }}</h3>

                <form action="/api/v1/student/buy-course/{{ course.id }}" method="post">
                    <button type="submit">
                        Add Course
                    </button>
                </form>

                <a href="/api/v1/student/courses/{{ course.id }}/units">
                    View Course
                </a>

            </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
