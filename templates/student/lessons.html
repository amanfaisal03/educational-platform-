<!DOCTYPE html>
<html>
<head>
    <title>Lessons</title>

    <style>

        .lesson{
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e6e6e6;
        }

        .links a{
            display: inline-block;
            margin-right: 8px;
            color: white;
            background: black;
            padding: 6px 10px;
        }


    </style>
</head>
      <h1> lessons by unite </h1>
<body>
{% for lesson in unite.lessons %}

    <div class="lesson">

        <h3>{{ lesson.title }}</h3>

        <div class="links">
            <a href="/student/lessons/{{ lesson.id }}/video" target="_blank">
                Video
            </a>

            <a href="/student/lessons/{{ lesson.id }}/pdf" target="_blank">
                PDF
            </a>
        </div>

    </div>

{% endfor %}

</body>
</html>
