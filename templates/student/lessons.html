<!DOCTYPE html>
<html>
<head>
    <title>Lessons</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main>
<h1>Lessons</h1>
{% for lesson in unite.lessons %}

    <div class="lesson">

        <h3>{{ lesson.title }}</h3>

        <div class="links">
            <a class="button" href="/api/v1/student/lessons/{{ lesson.id }}/video" target="_blank">
                Video
            </a>

            <a class="button" href="/api/v1/student/lessons/{{ lesson.id }}/pdf" target="_blank">
                PDF
            </a>
        </div>

    </div>

{% endfor %}
</main>
</body>
</html>
