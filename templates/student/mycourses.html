<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Courses</title>

    <style>


        .card{
            background: white;
            padding: 16px;
        }

    .btn{
    padding: 8px 12px;
    background: black;
    color: white;
    }

    </style>
</head>

<body>

<h1>My Courses</h1>

{% if courses %}

    {% for course in courses %}
        <div class="card">

            <h2>{{ course.name }}</h2>

            <a class="btn" href="/student/courses/{{ course.id }}/units">
                Enter Course
            </a>

        </div>
    {% endfor %}

{% else %}

    <p>No enrolled courses.</p>

{% endif %}

</body>
</html>
