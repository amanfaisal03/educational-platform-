<!DOCTYPE html>
<html>
<head>
    <title>Units</title>

    <style>
        .btn{
            display: inline-block;
            padding: 8px 12px;
            background: black;
            color: white;
            font-size: 14px;
        }

    </style>
</head>

<body>

<h1>Course Units</h1>

{% for unit in units %}
    <div class="unit">

        <h3>{{ unit.title }}</h3>

        <a class="btn" href="/student/units/{{ unit.id }}/lessons">
            View Lessons
        </a>

    </div>
{% endfor %}

</body>
</html>
