<!DOCTYPE html>
<html>
<head>
    <title>Units</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
<main>
<h1>Course Units</h1>

{% for unit in course.units %}

    <div class="card">

        <h3>{{ unit.title }}</h3>

        <a href="/api/v1/student/units/{{ unit.id }}/lessons">
            View Lessons
        </a>

    </div>
                                           
{% endfor %}
</main>
</body>
</html>
